# Database configuration
# Set DB_USERNAME and DB_PASSWORD in your local environment; never commit credentials.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Library_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

# Do not expose internal exception details to API clients.
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# Configure a strong, random JWT_SECRET through the environment.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Keep security logs at a production-safe level.
logging.level.org.springframework.security=INFO
